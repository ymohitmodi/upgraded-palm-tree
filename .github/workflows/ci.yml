name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Cross-platform proof: the factory is developed on Windows 11 and must also
    # run on Linux and macOS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        if: runner.os == 'Linux'
        run: ruff check nyx tests

      - name: Test (pytest)
        # NYX runs in deterministic MOCK mode with no OLLAMA_API_KEY, so the
        # whole factory + evolution + memory is exercised offline in CI.
        run: pytest -q
