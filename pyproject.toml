[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-dark-factory"
version = "0.1.0"
description = "NYX — a constitutional, self-evolving, multi-agent autonomous software dark factory on Ollama Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NYX Autonomous Dark Factory" }]
keywords = ["agents", "dark-factory", "agentic", "ollama", "constitutional-ai", "autonomous", "solopreneur"]

# Core is intentionally dependency-light so it runs on a mini-PC and offline.
# The Ollama Cloud provider uses `requests` if present, else falls back to stdlib.
dependencies = []

[project.optional-dependencies]
http = ["requests>=2.31"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "PyYAML>=6.0"]

[project.scripts]
nyx = "nyx.__main__:main"

[tool.setuptools.packages.find]
include = ["nyx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
